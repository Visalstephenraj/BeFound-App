name: befound_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # iOS style icons
  cupertino_icons: ^1.0.8

  # Bloc package (for state management)
  flutter_bloc: ^8.1.3

  # Equatable (for comparing Bloc states/events)
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    - assets/images/splash.png
    - assets/images/onboarding_1.png
    - assets/images/onboarding_2.png
    - assets/images/onboarding_3.png
    - assets/images/forgetimg.png
    - assets/images/otp.png
    - assets/images/reset_pass.png
    - assets/images/loginsucc.png
    - assets/images/profile.png
    - assets/images/registersucc.png  
